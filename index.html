<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camper Cafe</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="menu">
      <main>
        <header>
          <h1>Camper Café</h1>
          <p>Est. 2020</p>
        </header>
        <hr />
        <section>
          <h2>Coffee</h2>
          <figure>
            <img
              src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg"
              alt="coffee icon"
            />
          </figure>
          <dl>
            <div class="menu-item">
              <dt>French Vanilla</dt>
              <dd>3.00</dd>
            </div>

            <div class="menu-item">
              <dt>Caramel Macchiato</dt>
              <dd>3.75</dd>
            </div>

            <div class="menu-item">
              <dt>Pumpkin Spice</dt>
              <dd>3.50</dd>
            </div>

            <div class="menu-item">
              <dt>Halzenut</dt>
              <dd>4.00</dd>
            </div>

            <div class="menu-item">
              <dt>Mocha</dt>
              <dd>4.50</dd>
            </div>
          </dl>
        </section>
        <hr />
        <section>
          <h2>Desserts</h2>
          <figure>
            <img
              src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg"
              alt="pie icon"
            />
          </figure>
          <dl>
            <div class="menu-item">
              <dt>Donut</dt>
              <dd>1.50</dd>
            </div>
            <div class="menu-item">
              <dt>Cherry Pie</dt>
              <dd>2.75</dd>
            </div>
            <div class="menu-item">
              <dt>Chessecake</dt>
              <dd>3.00</dd>
            </div>
            <div class="menu-item">
              <dt>Cinnamon Roll</dt>
              <dd>2.50</dd>
            </div>
          </dl>
        </section>
      </main>
      <footer>
        <address>
          <p>
            <a href="https://www.freecodecamp.org" target="_blank"
              >Visit our website</a
            >
          </p>
          <p class="address">123 Free Code Camp Drive</p>
        </address>
      </footer>
    </div>
  </body>
</html>
